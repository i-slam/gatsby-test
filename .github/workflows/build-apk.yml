name: Build APK

on:
  push:
    paths:
      - "RamCleaner/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RamCleaner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle version comes from RamCleaner/gradle/wrapper (8.14.3).
      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ships the Android SDK (ANDROID_HOME is preset).
      - name: Build debug + release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RamCleaner-apk
          path: RamCleaner/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
